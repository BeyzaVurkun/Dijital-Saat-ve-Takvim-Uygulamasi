<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takvim Uygulaması</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="clock">
        <h2>Dijital Saat</h2>
        <div class="container">
            <div class="clock-items">
                <p id="hour">15</p>
            </div>
            <div class="clock-items">
                <p id="minute">23</p>
            </div>
            <div class="clock-items">
                <p id="second">42</p>
            </div>
            </div>
            <p id="date"></p>
    </div>

</body>
<script src="script.js">
</script>
</html>
